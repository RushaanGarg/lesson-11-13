<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Delivery Tracker</title>
    <style>
        body {
            font-family: arial,sans-serif;
            background: aliceblue;
            text-align: center;
            padding: 30px;
        }
        h1 {color: #ff5a43;}
        button {
            background: #ff5a43;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }
        div {
            border: 1px solid #ff5a43;
            width: 280px;
            margin: 6px auto;
            padding: 8px 12px;
            text-align: left;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>My Delivery Tracker</h1>
    <button onclick="saveorder()">Save Order</button>
    <div>JSON Text:<span id="json-text"></span></div>
    <div>Loaded Item:<span id="loaded-item"></span></div>
    <div>Loaded Price:<span id="loaded-price"></span></div>
    <div>Status:<span id="status"></span></div>
    <div>Result:<span id="result"></span></div>
    <script>
        let order = {
            item: "pizza",
            price: 5,
            shop: "My Snack Shop"
        };
        function saveorder() {
            let jsontext =JSON.stringify(order)
            let loadedorder =JSON.parse(jsontext)
            document.getElementById("jsontext").innerHTML = jsontext;
            document.getElementById("loaded-item").innerHTML = loadedorder.item
            document.getElementById("loadedprice").innerHTML = "$" +loadedorder.price;
        }
        function delay(ms) {
            return new promise(function(resolve) {
                setTimeout(resolve,ms);  
            });
        }

                documet.getElementById("result").innerHTML = "";
                document.getElementById("status").innerHTML = "Order Recieved"
                setTimeout(function(){
                 documet.getElementById("status").innerHTML = "kitchen Is Prepering..."
                }, 1000);
                await delay(3000)
                document.getElementById("status").innerHTML = "Out for Delivery!"
                //await-pause for 2 seconds
                await delay(2000);
                document.getElementById("result").innerHTML = "Your Order Has Arrived"
            }
    </script>
</body>
</html>
